# Mid-asm hooks: guest address -> host function in src/patches/.

# D3D present (sub_83066D80): r11 = vblanks per swap derived from device+13596
# (PresentationInterval; Wet uses 2 = 30 fps). Hook runs before `lwz r10,11860(r31)`.
[[midasm_hook]]
name = "WetPresentIntervalHook"
address = 0x83066E70
registers = ["r11"]

# Player control snapshot (sub_829B8078): right stick was just read into player+164/+168 and
# run through sub_829A64B8 (dead zone/curve); 0x829B812C is the join point either way.
# The camera (sub_829B1960 -> sub_829AB470) turns by dt * speed * stick and other code uses a
# non-zero stick to stop auto-follow, so mouse motion is injected here as the exact stick value
# that turns the camera by the mouse angle. r29 = player.
[[midasm_hook]]
name = "WetMouseLookHook"
address = 0x829B812C
registers = ["r29"]
