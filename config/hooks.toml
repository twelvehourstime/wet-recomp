# Mid-asm hooks: guest address -> host function in src/patches/.

# D3D present (sub_83066D80): r11 = vblanks per swap derived from device+13596
# (PresentationInterval; Wet uses 2 = 30 fps). Hook runs before `lwz r10,11860(r31)`.
[[midasm_hook]]
name = "WetPresentIntervalHook"
address = 0x83066E70
registers = ["r11"]

# Player control snapshot (sub_829B8078): right stick was just read into player+164/+168 and
# run through sub_829A64B8 (dead zone/curve); 0x829B812C is the join point either way.
# The camera (sub_829B1960 -> sub_829AB470) turns by dt * speed * stick and other code uses a
# non-zero stick to stop auto-follow, so mouse motion is injected here as the exact stick value
# that turns the camera by the mouse angle. r29 = player. This hook also computes the per-frame
# value the mirror hooks below re-use.
[[midasm_hook]]
name = "WetMouseLookHook"
address = 0x829B812C
registers = ["r29"]

# Lock-on / slow-motion aim paths read the right stick themselves (GetRightStick into a stack
# vec2, then sub_829A64B8) instead of using the snapshot, so the mouse must be added there too,
# right after their processing call returns:
#   sub_8290F660: vec at r1+96 (0x8290F908 call) and, second site, r1+88 (0x8290FC8C call)
#   sub_82894A40: vec at r1+80 (0x82894D28 call); non-zero here means "player is steering",
#                 which is what releases the auto-lock camera.
[[midasm_hook]]
name = "WetMouseLookMirror96Hook"
address = 0x8290F90C
registers = ["r1"]

[[midasm_hook]]
name = "WetMouseLookMirror88Hook"
address = 0x8290FC90
registers = ["r1"]

# r28 = WeaponArmManager: its +316 flags word holds bit 0x800000 = aim assist enabled (what
# WeaponArmManager::IsAimAssistEnabled returns, set from the Options value); the hook also
# clears it every frame while wet_aim_assist is off.
[[midasm_hook]]
name = "WetMouseLookMirror80Hook"
address = 0x82894D2C
registers = ["r1", "r28"]

# Aim assist (sub_829B1960, camera update): if params+344 is set and the aim is within 0.01 rad
# of the target, the yaw/pitch limits become ~0 and the camera freezes on the target. A stick
# breaks out by pushing; per-frame mouse values never do. Hook before `cmplwi cr6,r7,0`:
# r7 = 0 (flag clear) while the mouse is being used, unless wet_mouse_aim_assist is on.
[[midasm_hook]]
name = "WetAimAssistHook"
address = 0x829B19B0
registers = ["r7"]

# Camera follow (sub_829AEE68): the camera update derives its angles in a basis copied from the
# target entity's transform (so the camera turns with the character's heading) unless the timer
# at camera+464 is below params+772, which selects a world basis instead. Hook before
# `fcmpu cr6,f12,f13` (f12 = timer): while the mouse is in use and wet_camera_follow is off,
# f12 = -1 so the world basis is always used and the camera stays where the mouse put it.
[[midasm_hook]]
name = "WetCameraFollowHook"
address = 0x829AEECC
registers = ["f12"]

# Mouse-only camera orbit (sub_829BA128, the camera controller update). While the character
# moves, the game's update rotates the boom (cam+80, camera position relative to the target)
# with the character's heading, which a mouse cannot counter. With wet_camera_follow off:
#   0x829BA328 (before the angle derivation): remember the boom the frame started with (v55).
#   0x829BA8C0 (final `stvx128 v126,r0,r28`): replace the game's new boom with the remembered
#   direction rotated only by this frame's mouse motion, keeping the game's new length (camera
#   collision). The mouse is applied here too, so it is not applied twice.
[[midasm_hook]]
name = "WetCameraBoomHook"
address = 0x829BA328
registers = ["r31", "v55"]

[[midasm_hook]]
name = "WetCameraBoomStoreHook"
address = 0x829BA8C0
registers = ["r31", "v126"]
