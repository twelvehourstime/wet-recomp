# Mid-asm hooks: guest address -> host function in src/patches/.

# D3D present (sub_83066D80): r11 = vblanks per swap derived from device+13596
# (PresentationInterval; Wet uses 2 = 30 fps). Hook runs before `lwz r10,11860(r31)`.
[[midasm_hook]]
name = "WetPresentIntervalHook"
address = 0x83066E70
registers = ["r11"]

# Player control snapshot (sub_829B8078): right stick was just read into player+164/+168 and
# run through sub_829A64B8 (dead zone/curve); 0x829B812C is the join point either way.
# The camera (sub_829B1960 -> sub_829AB470) turns by dt * speed * stick and other code uses a
# non-zero stick to stop auto-follow, so mouse motion is injected here as the exact stick value
# that turns the camera by the mouse angle. r29 = player. This hook also computes the per-frame
# value the mirror hooks below re-use.
[[midasm_hook]]
name = "WetMouseLookHook"
address = 0x829B812C
registers = ["r29"]

# Lock-on / slow-motion aim paths read the right stick themselves (GetRightStick into a stack
# vec2, then sub_829A64B8) instead of using the snapshot, so the mouse must be added there too,
# right after their processing call returns:
#   sub_8290F660: vec at r1+96 (0x8290F908 call) and, second site, r1+88 (0x8290FC8C call)
#   sub_82894A40: vec at r1+80 (0x82894D28 call); non-zero here means "player is steering",
#                 which is what releases the auto-lock camera.
[[midasm_hook]]
name = "WetMouseLookMirror96Hook"
address = 0x8290F90C
registers = ["r1"]

[[midasm_hook]]
name = "WetMouseLookMirror88Hook"
address = 0x8290FC90
registers = ["r1"]

# r28 = WeaponArmManager: its +316 flags word holds bit 0x800000 = aim assist enabled (what
# WeaponArmManager::IsAimAssistEnabled returns, set from the Options value); the hook also
# clears it every frame while wet_aim_assist is off.
[[midasm_hook]]
name = "WetMouseLookMirror80Hook"
address = 0x82894D2C
registers = ["r1", "r28"]

# Camera target-lock branch (sub_829B1960, camera update): if params+344 is set and the camera
# is within a threshold of the target angles (params+352/+364), the yaw/pitch limits are replaced
# so the camera locks onto them. While the character moves this is the camera follow (the
# target is the character's heading); a stick breaks out by pushing, per-frame mouse values
# never do. Hook before `cmplwi cr6,r7,0`: r7 = 0 (flag clear) whenever raw mouse mode is on
# and wet_camera_follow is off.
[[midasm_hook]]
name = "WetCameraLockHook"
address = 0x829B19B0
registers = ["r7"]

# Camera basis (sub_829AEE68): the camera's yaw/pitch are expressed in a basis built from the
# character's transform (copied as-is, or with a fixed offset rotation multiplied in), so the
# basis turns with the heading while the angles are smoothed toward last frame's stored
# values, which orbits the camera around the character as it strafes. While raw mouse mode is
# on and wet_camera_follow is off: r10 = 0 (params+764 clear) so the timer compare runs,
# then f12 = huge so the function returns right after the copy, and the hook rewrites the
# copied rotation rows (r30 = output matrix) with the identity: world-relative angles.
[[midasm_hook]]
name = "WetCameraBasisFlagHook"
address = 0x829AEEB8
registers = ["r10"]

[[midasm_hook]]
name = "WetCameraFollowHook"
address = 0x829AEECC
registers = ["f12", "r30"]

# Trailing camera (sub_829BA128): cam+192 is the smoothed target position; each frame the
# update subtracts the target's movement from the boom vector (v126 = new - old cam+192,
# then v1 = boom - v126) before converting the boom to angles, so the camera's world position
# stays put while the character walks away and the boom swings round behind the movement
# (strafing orbits the camera). Hook before `vsubfp128 v1,v55,v126`: v126 = 0 while raw mouse
# mode is on and wet_camera_follow is off, so the boom direction persists and the camera is
# carried with the character at the angle the mouse set.
[[midasm_hook]]
name = "WetCameraTrailHook"
address = 0x829BA328
registers = ["v126"]

# Follow camera (sub_829B9490, the camera used in open areas): while the camera's "moving" flag
# (flags160 bit 0) is set, the block at 0x829B95BC drives yaw and pitch toward target angles
# from the camera parameters (sub_829A3E10 "approach at rate"), which turns the camera with the
# character. Hook before `cmplwi cr6,r10,0` (r10 = that flag bit): r10 = 0 while mouse mode is
# on and wet_camera_follow is off, so the block is skipped and the camera stays where the mouse
# put it. Stick/mouse input and the distance logic later in the function are untouched.
[[midasm_hook]]
name = "WetCameraFollowMoveHook"
address = 0x829B95C4
registers = ["r10"]
